<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrickIt — Arkanoid</title>
<style>
  :root {
    --bg: #0b0e1a;
    --panel: #12172b;
    --accent: #4cc9f0;
    --accent2: #f72585;
    --text: #e8ecf8;
    --muted: #8b93b3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: radial-gradient(1200px 700px at 50% -10%, #1a2140 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
    overflow: hidden;
  }
  .logo {
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: 4px;
    font-weight: 800;
    font-size: clamp(28px, 5vw, 44px);
    background: linear-gradient(90deg, #4cc9f0, #7b61ff, #f72585);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-transform: uppercase;
    filter: drop-shadow(0 0 18px rgba(76, 201, 240, 0.35));
  }
  .logo small {
    display: block;
    font-size: 12px;
    letter-spacing: 6px;
    font-weight: 600;
    color: var(--muted);
    -webkit-text-fill-color: var(--muted);
    margin-top: 2px;
  }
  .hud {
    display: flex;
    gap: 28px;
    align-items: center;
    justify-content: space-between;
    width: min(800px, 94vw);
    padding: 8px 14px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px 12px 0 0;
    font-variant-numeric: tabular-nums;
  }
  .hud .item { display: flex; align-items: baseline; gap: 8px; }
  .hud .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
  .hud .value { font-size: 20px; font-weight: 700; color: var(--accent); min-width: 48px; }
  .hud .lives { font-size: 18px; color: var(--accent2); letter-spacing: 3px; }
  .hud .btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .hud .btn:hover { border-color: var(--accent); color: var(--accent); }
  #stage {
    display: block;
    background: #0d1122;
    border: 1px solid rgba(255,255,255,0.06);
    border-top: none;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    cursor: none;
    touch-action: none;
  }
  .help {
    margin-top: 10px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
  }
  .help kbd {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 11px;
    color: var(--text);
  }
</style>
</head>
<body>

<div class="logo">BrickIt<small>Arkanoid Minigame</small></div>

<div class="hud">
  <div class="item"><span class="label">Puntos</span><span class="value" id="score">0</span></div>
  <div class="item"><span class="label">Nivel</span><span class="value" id="level">1</span></div>
  <div class="item"><span class="label">Vidas</span><span class="lives" id="lives">♥♥♥</span></div>
  <button class="btn" id="btnSound" type="button">♪ Sonido: ON</button>
  <button class="btn" id="btnRestart" type="button"> Reiniciar</button>
</div>

<canvas id="stage" width="800" height="600"></canvas>

<div class="help">
  <kbd>←</kbd> <kbd>→</kbd> o ratón para mover · <kbd>Espacio</kbd> lanzar / pausar · <kbd>M</kbd> silenciar
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const elScore = document.getElementById("score");
  const elLevel = document.getElementById("level");
  const elLives = document.getElementById("lives");
  const btnSound = document.getElementById("btnSound");
  const btnRestart = document.getElementById("btnRestart");

  /* ---------------- Sonido (Web Audio API, sintético) ---------------- */
  const Sound = (() => {
    let actx = null;
    let enabled = true;

    function ensure() {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      return actx;
    }

    function tone({ freq = 440, end = null, dur = 0.08, type = "square", vol = 0.12, delay = 0 }) {
      if (!enabled) return;
      const ac = ensure();
      if (!ac) return;
      const t0 = ac.currentTime + delay;
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (end) osc.frequency.exponentialRampToValueAtTime(Math.max(1, end), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(ac.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    }

    function noise({ dur = 0.15, vol = 0.15, delay = 0, filterFreq = 1200 }) {
      if (!enabled) return;
      const ac = ensure();
      if (!ac) return;
      const t0 = ac.currentTime + delay;
      const len = Math.max(1, Math.floor(ac.sampleRate * dur));
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource();
      src.buffer = buf;
      const filt = ac.createBiquadFilter();
      filt.type = "lowpass";
      filt.frequency.value = filterFreq;
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(filt).connect(g).connect(ac.destination);
      src.start(t0);
    }

    return {
      unlock: ensure,
      get enabled() { return enabled; },
      toggle() { enabled = !enabled; if (enabled) ensure(); return enabled; },
      paddle()  { tone({ freq: 320, end: 480, dur: 0.07, type: "square", vol: 0.10 }); },
      wall()    { tone({ freq: 220, end: 180, dur: 0.05, type: "triangle", vol: 0.08 }); },
      brick(row){ tone({ freq: 440 + row * 60, end: 700 + row * 60, dur: 0.08, type: "square", vol: 0.10 }); noise({ dur: 0.06, vol: 0.06, filterFreq: 2600 }); },
      lose()    { tone({ freq: 300, end: 70, dur: 0.45, type: "sawtooth", vol: 0.14 }); },
      win()     { [523, 659, 784, 1047].forEach((f, i) => tone({ freq: f, dur: 0.18, type: "triangle", vol: 0.12, delay: i * 0.12 })); },
      launch()  { tone({ freq: 180, end: 420, dur: 0.1, type: "triangle", vol: 0.10 }); },
      lifeUp()  { [660, 880].forEach((f, i) => tone({ freq: f, dur: 0.12, type: "sine", vol: 0.12, delay: i * 0.1 })); }
    };
  })();

  /* ---------------- Estado del juego ---------------- */
  const STATE = { READY: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3, WIN: 4, LEVELCLEAR: 5 };

  const PADDLE = { w: 110, h: 14, speed: 620, y: H - 40 };
  const BALL_R = 8;
  const BRICKS = { rows: 6, cols: 10, top: 70, pad: 6, w: 70, h: 22 };
  BRICKS.offX = (W - (BRICKS.cols * BRICKS.w + (BRICKS.cols - 1) * BRICKS.pad)) / 2;

  const ROW_COLORS = ["#f72585", "#b5179e", "#7209b7", "#560bad", "#4361ee", "#4cc9f0"];
  const ROW_POINTS = [7, 6, 5, 4, 3, 2];

  const game = {
    state: STATE.READY,
    score: 0,
    lives: 3,
    level: 1,
    maxLevel: 3,
    bricks: [],
    bricksLeft: 0,
    particles: [],
    shake: 0,
    levelBanner: 0,
    best: 0
  };

  const paddle = { x: W / 2 - PADDLE.w / 2, w: PADDLE.w };
  const ball = { x: W / 2, y: PADDLE.y - BALL_R - 1, vx: 0, vy: 0, r: BALL_R, stuck: true, trail: [] };

  const keys = { left: false, right: false };
  const mouse = { x: W / 2, active: false };

  try { game.best = parseInt(localStorage.getItem("brickit_best") || "0", 10) || 0; } catch (_) {}

  /* ---------------- Niveles ---------------- */
  function buildLevel(level) {
    const bricks = [];
    const density = [0.9, 0.8, 0.7][Math.min(level, 3) - 1] ?? 0.7;
    for (let r = 0; r < BRICKS.rows; r++) {
      for (let c = 0; c < BRICKS.cols; c++) {
        const skip = ((r * 7 + c * 3 + level * 5) % 10) / 10 >= density;
        if (skip) continue;
        bricks.push({
          x: BRICKS.offX + c * (BRICKS.w + BRICKS.pad),
          y: BRICKS.top + r * (BRICKS.h + BRICKS.pad),
          w: BRICKS.w,
          h: BRICKS.h,
          row: r,
          alive: true
        });
      }
    }
    return bricks;
  }

  function ballSpeedForLevel(level) {
    return 340 + (level - 1) * 45;
  }

  /* ---------------- Ciclo de vida de partida ---------------- */
  function resetBall(stuck = true) {
    ball.stuck = stuck;
    ball.vx = 0;
    ball.vy = 0;
    ball.trail.length = 0;
    stickBallToPaddle();
  }

  function stickBallToPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = PADDLE.y - ball.r - 1;
  }

  function launchBall() {
    if (!ball.stuck) return;
    ball.stuck = false;
    game.state = STATE.PLAYING;
    const speed = ballSpeedForLevel(game.level);
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    Sound.launch();
  }

  function loadLevel(level, keepLives) {
    game.level = level;
    game.bricks = buildLevel(level);
    game.bricksLeft = game.bricks.length;
    game.particles.length = 0;
    paddle.w = Math.max(72, PADDLE.w - (level - 1) * 8);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall(true);
    if (!keepLives) game.lives = 3;
    game.state = STATE.READY;
    game.levelBanner = 1.6;
    updateHud();
  }

  function startGame() {
    game.score = 0;
    loadLevel(1, false);
  }

  function updateHud() {
    elScore.textContent = String(game.score);
    elLevel.textContent = String(game.level);
    elLives.textContent = game.lives > 0 ? "♥".repeat(game.lives) : "—";
  }

  function addScore(n) {
    game.score += n;
    if (game.score > game.best) {
      game.best = game.score;
      try { localStorage.setItem("brickit_best", String(game.best)); } catch (_) {}
    }
    updateHud();
  }

  /* ---------------- Entrada ---------------- */
  window.addEventListener("keydown", (e) => {
    Sound.unlock();
    if (e.code === "ArrowLeft")  { keys.left = true;  mouse.active = false; e.preventDefault(); }
    if (e.code === "ArrowRight") { keys.right = true; mouse.active = false; e.preventDefault(); }
    if (e.code === "Space") {
      e.preventDefault();
      if (game.state === STATE.READY) launchBall();
      else if (game.state === STATE.PLAYING) game.state = STATE.PAUSED;
      else if (game.state === STATE.PAUSED) game.state = STATE.PLAYING;
      else if (game.state === STATE.GAMEOVER || game.state === STATE.WIN) startGame();
    }
    if (e.code === "KeyM") toggleSound();
    if (e.code === "KeyR") startGame();
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft")  keys.left = false;
    if (e.code === "ArrowRight") keys.right = false;
  });

  function pointerToCanvas(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener("mousemove", (e) => {
    mouse.x = pointerToCanvas(e);
    mouse.active = true;
  });
  canvas.addEventListener("touchmove", (e) => {
    Sound.unlock();
    mouse.x = pointerToCanvas(e);
    mouse.active = true;
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener("mousedown", () => {
    Sound.unlock();
    if (game.state === STATE.READY) launchBall();
    else if (game.state === STATE.GAMEOVER || game.state === STATE.WIN) startGame();
    else if (game.state === STATE.PAUSED) game.state = STATE.PLAYING;
  });
  canvas.addEventListener("touchstart", (e) => {
    Sound.unlock();
    if (game.state === STATE.READY) launchBall();
    else if (game.state === STATE.GAMEOVER || game.state === STATE.WIN) startGame();
    e.preventDefault();
  }, { passive: false });

  function toggleSound() {
    const on = Sound.toggle();
    btnSound.textContent = on ? "♪ Sonido: ON" : "♪ Sonido: OFF";
  }
  btnSound.addEventListener("click", (e) => { e.stopPropagation(); toggleSound(); });
  btnRestart.addEventListener("click", (e) => { e.stopPropagation(); Sound.unlock(); startGame(); });

  /* ---------------- Física ---------------- */
  function update(dt) {
    if (game.levelBanner > 0) game.levelBanner -= dt;
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 3);

    // Partículas siempre se actualizan
    for (let i = game.particles.length - 1; i >= 0; i--) {
      const p = game.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 500 * dt;
      p.life -= dt;
      if (p.life <= 0) game.particles.splice(i, 1);
    }

    if (game.state !== STATE.PLAYING && game.state !== STATE.READY) return;

    // Paleta
    if (keys.left)  { paddle.x -= PADDLE.speed * dt; mouse.active = false; }
    if (keys.right) { paddle.x += PADDLE.speed * dt; mouse.active = false; }
    if (mouse.active) {
      const target = mouse.x - paddle.w / 2;
      const maxStep = 1400 * dt;
      const diff = target - paddle.x;
      paddle.x += Math.max(-maxStep, Math.min(maxStep, diff));
    }
    paddle.x = Math.max(8, Math.min(W - paddle.w - 8, paddle.x));

    if (ball.stuck) {
      stickBallToPaddle();
      return;
    }

    // Rastro
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 12) ball.trail.shift();

    // Movimiento con sub-pasos para evitar atravesar ladrillos
    const speed = Math.hypot(ball.vx, ball.vy);
    const steps = Math.max(1, Math.ceil((speed * dt) / (ball.r * 0.8)));
    const sdt = dt / steps;

    for (let s = 0; s < steps; s++) {
      ball.x += ball.vx * sdt;
      ball.y += ball.vy * sdt;

      // Paredes
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); Sound.wall(); spark(ball.x, ball.y, "#4cc9f0", 4); }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); Sound.wall(); spark(ball.x, ball.y, "#4cc9f0", 4); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); Sound.wall(); spark(ball.x, ball.y, "#4cc9f0", 4); }

      // Suelo: pierde vida
      if (ball.y - ball.r > H) {
        loseLife();
        return;
      }

      // Paleta
      if (
        ball.vy > 0 &&
        ball.y + ball.r >= PADDLE.y &&
        ball.y - ball.r <= PADDLE.y + PADDLE.h &&
        ball.x >= paddle.x - ball.r &&
        ball.x <= paddle.x + paddle.w + ball.r
      ) {
        ball.y = PADDLE.y - ball.r;
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
        const clamped = Math.max(-1, Math.min(1, hit));
        const maxBounce = Math.PI / 3; // 60°
        const angle = -Math.PI / 2 + clamped * maxBounce;
        const sp = Math.min(620, Math.hypot(ball.vx, ball.vy) * 1.02);
        ball.vx = Math.cos(angle) * sp;
        ball.vy = Math.sin(angle) * sp;
        Sound.paddle();
        spark(ball.x, PADDLE.y, "#7b61ff", 6);
      }

      // Ladrillos
      for (let i = 0; i < game.bricks.length; i++) {
        const b = game.bricks[i];
        if (!b.alive) continue;
        if (
          ball.x + ball.r > b.x &&
          ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y &&
          ball.y - ball.r < b.y + b.h
        ) {
          // Determina el eje de rebote según solapamiento mínimo
          const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
          const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
          if (overlapX < overlapY) {
            ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
          } else {
            ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
          }
          hitBrick(b, i);
          break; // un ladrillo por sub-paso
        }
      }
    }

    // Velocidad mínima vertical para evitar ángulos rasantes eternos
    const v = Math.hypot(ball.vx, ball.vy);
    if (v > 0 && Math.abs(ball.vy) < v * 0.18) {
      ball.vy = (ball.vy >= 0 ? 1 : -1) * v * 0.18;
      const rem = Math.sqrt(Math.max(0, v * v - ball.vx * ball.vx));
      ball.vx = (ball.vx >= 0 ? 1 : -1) * rem;
    }
  }

  function hitBrick(b, index) {
    b.alive = false;
    game.bricksLeft--;
    addScore(ROW_POINTS[b.row] * 10 * game.level);
    Sound.brick(BRICKS.rows - b.row);
    burst(b.x + b.w / 2, b.y + b.h / 2, ROW_COLORS[b.row], 12);
    game.shake = Math.min(1, game.shake + 0.25);

    if (game.bricksLeft <= 0) {
      addScore(250 * game.level);
      if (game.level >= game.maxLevel) {
        game.state = STATE.WIN;
        Sound.win();
      } else {
        game.state = STATE.LEVELCLEAR;
        setTimeout(() => {
          if (game.state === STATE.LEVELCLEAR) loadLevel(game.level + 1, true);
        }, 1400);
      }
    }
  }

  function loseLife() {
    game.lives--;
    updateHud();
    game.shake = 1;
    if (game.lives <= 0) {
      game.state = STATE.GAMEOVER;
      Sound.lose();
    } else {
      Sound.lose();
      resetBall(true);
      game.state = STATE.READY;
    }
  }

  /* ---------------- Efectos ---------------- */
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 220;
      game.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 60,
        life: 0.4 + Math.random() * 0.5,
        max: 0.9,
        color,
        size: 2 + Math.random() * 3
      });
    }
  }
  function spark(x, y, color, n) { burst(x, y, color, n); }

  /* ---------------- Render ---------------- */
  function draw() {
    ctx.save();
    if (game.shake > 0) {
      const s = game.shake * 5;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    // Fondo
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#0f1430");
    grad.addColorStop(1, "#0a0d1c");
    ctx.fillStyle = grad;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Sutil rejilla
    ctx.strokeStyle = "rgba(255,255,255,0.025)";
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    drawBricks();
    drawPaddle();
    drawBall();
    drawParticles();

    if (game.levelBanner > 0 && (game.state === STATE.READY || game.state === STATE.PLAYING)) {
      const a = Math.min(1, game.levelBanner);
      ctx.globalAlpha = a;
      ctx.fillStyle = "#e8ecf8";
      ctx.font = "700 34px 'Segoe UI', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`NIVEL ${game.level}`, W / 2, H / 2 - 60);
      ctx.font = "400 16px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = "#8b93b3";
      ctx.fillText(`Destruye todos los ladrillos · Mejor: ${game.best}`, W / 2, H / 2 - 30);
      ctx.globalAlpha = 1;
    }

    if (game.state === STATE.READY) drawOverlay("BrickIt", "Pulsa ESPACIO o haz clic para lanzar", "#4cc9f0");
    if (game.state === STATE.PAUSED) drawOverlay("PAUSA", "Espacio para continuar", "#8b93b3");
    if (game.state === STATE.LEVELCLEAR) drawOverlay(`¡Nivel ${game.level} superado!`, `+${250 * game.level} puntos · siguiente nivel...`, "#4cc9f0");
    if (game.state === STATE.GAMEOVER) drawOverlay("GAME OVER", `Puntuación: ${game.score} · Mejor: ${game.best} — Espacio/R para reiniciar`, "#f72585");
    if (game.state === STATE.WIN) drawOverlay("¡VICTORIA!", `Puntuación final: ${game.score} · Mejor: ${game.best} — Espacio/R para reiniciar`, "#7b61ff");

    ctx.restore();
  }

  function drawBricks() {
    for (const b of game.bricks) {
      if (!b.alive) continue;
      const color = ROW_COLORS[b.row];
      const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      g.addColorStop(0, lighten(color, 0.25));
      g.addColorStop(1, color);
      ctx.fillStyle = g;
      roundRect(b.x, b.y, b.w, b.h, 5);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      roundRect(b.x + 2, b.y + 2, b.w - 4, 4, 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.25)";
      ctx.lineWidth = 1;
      roundRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1, 5);
      ctx.stroke();
    }
  }

  function drawPaddle() {
    const x = paddle.x, y = PADDLE.y, w = paddle.w, h = PADDLE.h;
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, "#7b61ff");
    g.addColorStop(1, "#4361ee");
    ctx.shadowColor = "rgba(123,97,255,0.6)";
    ctx.shadowBlur = 16;
    ctx.fillStyle = g;
    roundRect(x, y, w, h, 7);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    roundRect(x + 3, y + 2, w - 6, 4, 2);
    ctx.fill();
  }

  function drawBall() {
    // Rastro
    for (let i = 0; i < ball.trail.length; i++) {
      const t = ball.trail[i];
      const a = (i + 1) / ball.trail.length * 0.35;
      ctx.beginPath();
      ctx.arc(t.x, t.y, ball.r * (0.4 + 0.6 * a), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(76,201,240,${a.toFixed(3)})`;
      ctx.fill();
    }
    const g = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, ball.r);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.4, "#90e0ef");
    g.addColorStop(1, "#4cc9f0");
    ctx.shadowColor = "rgba(76,201,240,0.9)";
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of game.particles) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay(title, subtitle, color) {
    ctx.fillStyle = "rgba(6,8,18,0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.shadowColor = color;
    ctx.shadowBlur = 24;
    ctx.fillStyle = color;
    ctx.font = "800 56px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 10);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#e8ecf8";
    ctx.font = "400 18px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText(subtitle, W / 2, H / 2 + 30);
    if (game.state === STATE.GAMEOVER || game.state === STATE.WIN) {
      ctx.fillStyle = "#8b93b3";
      ctx.font = "400 14px 'Segoe UI', system-ui, sans-serif";
      ctx.fillText("Espacio o clic para jugar de nuevo", W / 2, H / 2 + 62);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function lighten(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.min(255, Math.round(r + 255 * amt));
    g = Math.min(255, Math.round(g + 255 * amt));
    b = Math.min(255, Math.round(b + 255 * amt));
    return `rgb(${r},${g},${b})`;
  }

  /* ---------------- Bucle principal ---------------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  startGame();
  updateHud();
  requestAnimationFrame(frame);
})();
</script>
